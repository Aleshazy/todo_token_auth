services:
  # PostgreSQL database container.
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: todo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # FastAPI application container.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/todo_db
      TOKEN_LIFETIME_MINUTES: 60
    ports:
      - "8000:8000"

volumes:
  # Named Docker volume to persist database data.
  pg_data: